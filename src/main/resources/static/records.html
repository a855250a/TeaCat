<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TeaCat｜健康紀錄</title><link rel="stylesheet" href="style.css"></head><body><div class="container">
<header class="dashboard-header"><a href="/dashboard.html" class="brand"><div><h1>🐾 TeaCat</h1><p>Pet Health, Made Simple.</p></div></a><nav class="desktop-nav"><a href="/dashboard.html">首頁</a><a href="/pets.html">我的寵物</a><a href="/records.html" class="active">健康紀錄</a><a href="/ai.html">TeaCat AI</a></nav><div class="header-user-area"><div class="login-identity"><span id="loginIdentityIcon">👤</span><span id="loginIdentityText">使用者</span></div><button id="logoutButton" class="logout-button">登出</button></div></header>
<section class="welcome-section"><h2>健康紀錄</h2><p>集中管理毛孩的看診、疫苗、檢驗、體重與其他健康資訊。</p></section>
<section class="health-grid"><div class="card health-card"><span class="health-icon">🏥</span><p>看診紀錄</p><h3 id="visitCount">0 筆</h3></div><div class="card health-card"><span class="health-icon">💉</span><p>疫苗紀錄</p><h3 id="vaccineCount">0 筆</h3></div><div class="card health-card"><span class="health-icon">🧪</span><p>檢驗報告</p><h3 id="labCount">0 筆</h3></div></section>
<section class="card"><div class="section-title"><span class="section-label">NEW RECORD</span><h2>新增健康紀錄</h2><p>建立毛孩的健康時間軸</p></div><div class="record-form form-grid"><label>寵物<select id="recordPetId"></select></label><label>日期<input id="recordDate" type="date"></label><label>類型<select id="recordType"><option value="VISIT">看診</option><option value="VACCINE">疫苗</option><option value="LAB">檢驗</option><option value="WEIGHT">體重</option><option value="OTHER">其他</option></select></label><label>標題<input id="recordTitle" placeholder="例如：年度健康檢查"></label><label>體重（kg，可選）<input id="recordWeight" type="number" step="0.1" placeholder="例如：4.2"></label><label class="full-width">備註<textarea id="recordNotes" rows="4" placeholder="症狀、獸醫建議、檢驗摘要…"></textarea></label><button id="saveRecordButton" class="full-width">新增健康紀錄</button></div></section>
<section class="card"><div class="section-title"><span class="section-label">HEALTH TIMELINE</span><h2>📋 健康時間軸</h2><p>依照日期查看完整健康紀錄</p></div><div id="recordList"><p class="loading">正在載入健康紀錄...</p></div></section></div>
<nav class="mobile-bottom-nav"><a href="/dashboard.html"><span>🏠</span><small>首頁</small></a><a href="/pets.html"><span>🐾</span><small>寵物</small></a><a href="/records.html" class="active"><span>📋</span><small>紀錄</small></a><a href="/ai.html"><span>✨</span><small>AI</small></a></nav><script src="script.js"></script></body></html>
