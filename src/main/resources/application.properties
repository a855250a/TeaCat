spring.application.name=TeaCat

# Database: local defaults + deployment environment overrides
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/teacat}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

# Render/Railway-style platforms provide PORT; local remains 8080
server.port=${PORT:8080}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Permanent image storage. Configure these three variables on Render.
# If omitted locally, TeaCat falls back to ./uploads for development only.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
